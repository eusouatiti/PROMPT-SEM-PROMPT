<div class="bg-white p-8 rounded-2xl shadow-sm border border-neutral-100">
  <h2 class="text-2xl font-bold mb-6 text-neutral-950">Sua instrução inteligente está pronta</h2>
  <div class="bg-neutral-50 p-6 rounded-xl border border-neutral-200 mb-6 text-neutral-800 text-lg">
    {{ prompt() }}
  </div>
  <div class="grid grid-cols-2 gap-4">
    <button (click)="copyToClipboard()" class="bg-neutral-900 text-white py-4 rounded-xl font-medium hover:bg-neutral-800 transition-colors">Copiar comando</button>
    <button (click)="downloadPDF()" class="bg-blue-600 text-white py-4 rounded-xl font-medium hover:bg-blue-700 transition-colors">Baixar PDF</button>
    <button (click)="restart()" class="col-span-2 bg-neutral-200 text-neutral-900 py-4 rounded-xl font-medium hover:bg-neutral-300 transition-colors">Voltar à tela inicial para novo conceito</button>
  </div>
</div>
