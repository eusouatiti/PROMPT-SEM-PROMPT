@if (wizard.step() <= 6) {
  <div class="bg-white p-8 rounded-2xl shadow-sm border border-neutral-100">
    <div class="h-2 bg-neutral-100 rounded-full mb-8">
      <div class="h-full bg-neutral-900 rounded-full" [style.width.%]="(wizard.step() / 6) * 100"></div>
    </div>
    <div class="text-sm text-neutral-500 mb-6 font-medium">Etapa {{ wizard.step() }} de 6</div>
    <h2 class="text-2xl font-bold mb-8 text-neutral-950">{{ currentStep?.title }}</h2>

    <div class="grid md:grid-cols-2 gap-4">
      @for (option of currentStep?.options; track option) {
        <button 
          (click)="selectOption(option)"
          [class.bg-neutral-900]="selectedOptions.includes(option)" 
          [class.text-white]="selectedOptions.includes(option)"
          class="text-left p-4 rounded-xl border border-neutral-200 hover:border-neutral-900 hover:bg-neutral-50 transition-colors font-medium">
          {{ option }}
        </button>
      }
    </div>

    @if (currentStep?.multi) {
      <button (click)="finishMulti()" class="mt-8 bg-neutral-900 text-white w-full py-4 rounded-xl font-medium hover:bg-neutral-800 transition-colors text-lg">Continuar</button>
    }
    
    @if (wizard.step() > 1) {
      <button (click)="wizard.goBack()" class="mt-4 w-full text-neutral-500 hover:text-neutral-900 font-medium">← Voltar</button>
    }
  </div>
} @else {
  <app-result></app-result>
}
